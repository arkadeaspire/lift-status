<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #0f172a;
      padding: 24px;
    }
    .box {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 20px;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
    }
    #result {
      margin-top: 14px;
      padding: 12px;
      background: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>GitHub Pages Verification</h2>
    <p>If you see this box on <strong>arkadeaspire.github.io/lift-status/</strong>, HTML and CSS are deploying properly.</p>
    <button id="verifyBtn" type="button">Test Login Click</button>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById("verifyBtn").addEventListener("click", function () {
      var el = document.getElementById("result");
      el.style.display = "block";
      el.textContent = "JavaScript click worked at " + new Date().toLocaleTimeString();
    });
  </script>
</body>
</html>
