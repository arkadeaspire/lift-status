<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lift Pulse — Society Lift Status & Audit Log</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --working-bg: #ecfdf5;
      --working-border: #10b981;
      --working-text: #047857;
      --working-glow: rgba(16, 185, 129, 0.22);
      --down-bg: #fff1f2;
      --down-border: #f43f5e;
      --down-text: #be123c;
      --down-glow: rgba(244, 63, 94, 0.22);
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger-soft: #ffe4e6;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.09);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #eef2ff 0%, var(--bg) 42%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 56px;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Top Bar */
    .topbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.28);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .auth-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .role-pill {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .role-pill.tech {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
    }

    .role-pill.admin {
      background: var(--accent-soft);
      border-color: #c7d2fe;
      color: #3730a3;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--down-text);
      border: 1px solid #fecdd3;
    }

    .btn-danger:hover {
      background: #fecdd3;
    }

    /* Summary Strip */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .stat-val.green { color: var(--working-text); }
    .stat-val.red { color: var(--down-text); }

    /* Wings */
    .wing-section {
      margin-bottom: 28px;
    }

    .wing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .wing-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .wing-meta {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .lift-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 980px) {
      .lift-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .lift-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Lift Widget */
    .lift-card {
      position: relative;
      border-radius: var(--radius);
      padding: 20px 18px;
      border: 2px solid transparent;
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 168px;
      user-select: none;
    }

    .lift-card.can-toggle {
      cursor: pointer;
    }

    .lift-card.can-toggle:hover {
      transform: translateY(-4px);
    }

    .lift-card.working {
      background: linear-gradient(165deg, #ffffff 0%, var(--working-bg) 100%);
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(16, 185, 129, 0.08), 0 12px 24px -6px var(--working-glow);
    }

    .lift-card.out-of-order {
      background: linear-gradient(165deg, #ffffff 0%, var(--down-bg) 100%);
      border-color: rgba(244, 63, 94, 0.48);
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(244, 63, 94, 0.08), 0 12px 24px -6px var(--down-glow);
    }

    .lift-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lift-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .tap-hint {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(15, 23, 42, 0.08);
      color: var(--muted);
    }

    .lift-status {
      margin: 14px 0 10px;
      font-size: 1.28rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .lift-card.working .lift-status {
      color: var(--working-text);
    }

    .lift-card.out-of-order .lift-status {
      color: var(--down-text);
    }

    .lift-time {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.35;
    }

    .lift-time span {
      color: var(--text);
      font-weight: 700;
    }

    /* Audit Table */
    .audit-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      margin-top: 28px;
    }

    .audit-card.visible {
      display: block;
    }

    .audit-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .audit-header h2 {
      font-size: 1.12rem;
      font-weight: 800;
    }

    .audit-header p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .audit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      min-width: 720px;
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge-state {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
    }

    .badge-state.working {
      background: var(--working-bg);
      color: var(--working-text);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .badge-state.out-of-order {
      background: var(--down-bg);
      color: var(--down-text);
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
    }

    /* Login & Confirm Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.25);
      border: 1px solid var(--border);
    }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal p {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .role-option {
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .role-option.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .passcode-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 1rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .passcode-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .error-msg {
      color: var(--down-text);
      font-size: 0.8rem;
      font-weight: 700;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">LP</div>
        <div>
          <h1>Society Lift Status</h1>
          <p id="modeIndicator">View-Only Mode • Firebase Realtime Sync</p>
        </div>
      </div>

      <div class="auth-controls">
        <span id="rolePill" class="role-pill">Resident (View Only)</span>
        <button id="loginBtn" class="btn btn-primary" type="button">Login</button>
        <button id="logoutBtn" class="btn btn-ghost" type="button" style="display: none;">Logout</button>
      </div>
    </header>

    <section class="summary-strip">
      <div class="stat-card">
        <div class="stat-label">Total Lifts</div>
        <div class="stat-val" id="totalCount">10</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Working</div>
        <div class="stat-val green" id="workingCount">10</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Out of Order</div>
        <div class="stat-val red" id="downCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Audit Entries</div>
        <div class="stat-val" id="auditCount">0</div>
      </div>
    </section>

    <main
